name: driftty-dev

services:
  web:
    image: driftty-web:dev
    build:
      context: .
      target: web-development
    command: npm run dev -- --host 0.0.0.0
    environment:
      DEV_ACCESS_TOKEN: "${DRIFTTY_DEV_TOKEN:?Set DRIFTTY_DEV_TOKEN to a URL-safe secret}"
      DEV_ALLOWED_HOST: "${DRIFTTY_DEV_HOSTNAME:?Set DRIFTTY_DEV_HOSTNAME to this host's Tailscale MagicDNS name}"
      VITE_TTYD_PROXY_TARGET: http://terminal:7681
    ports:
      - "127.0.0.1:${DRIFTTY_DEV_PORT:-7681}:9000"
      - "${DRIFTTY_DEV_TAILSCALE_IP:?Set DRIFTTY_DEV_TAILSCALE_IP to this host's Tailscale IPv4}:${DRIFTTY_DEV_PORT:-7681}:9000"
    volumes:
      - ./src:/src/src:ro
      - ./index.html:/src/index.html:ro
      - ./tsconfig.json:/src/tsconfig.json:ro
      - ./vite.config.ts:/src/vite.config.ts:ro
    depends_on:
      terminal:
        condition: service_healthy
    restart: unless-stopped

  terminal:
    image: driftty:dev
    build:
      context: .
      target: generic
    command: sh
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7681/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
