auth:
  # Keep the real file out of Git. These are example credentials.
  password: replace-this-writer-password
  session_secret: replace-this-with-a-long-random-secret

profiles:
  - slug: baz
    label: Baz server
    host_label: Baz
    host: baz.example.net
    port: 22
    user: mark
    key: baz
    sessions:
      - name: mdp
        label: MDP terminal
        directory: /home/mark
    public_watch: true
    new_sessions:
      enabled: true
      directory: /home/mark
      prefix: ttyd-
      # max: 20
