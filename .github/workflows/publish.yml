name: Publish images

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: generic
            image: ttyd-mobile
          - target: gateway
            image: ttyd-mobile-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mdp/${{ matrix.image }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/mdp/ttyd-mobile
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.licenses=MIT
