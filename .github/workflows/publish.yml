name: Publish images

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: generic
            image: driftty
            platforms: linux/amd64,linux/arm64
          - target: demo
            image: driftty-demo
            platforms: linux/amd64
          - target: gateway
            image: driftty-gateway
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Ensure buildkit image is available (retry Docker Hub pull)
        run: |
          retry() {
            for attempt in 1 2 3 4 5; do
              if docker pull moby/buildkit:buildx-stable-1; then
                return 0
              fi
              echo "Docker Hub pull failed (attempt ${attempt}/5); retrying in $((attempt * 10))s"
              sleep "$((attempt * 10))"
            done
            return 1
          }
          retry
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ghcr.io/mdp/${{ matrix.image }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/mdp/driftty
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.licenses=MIT
