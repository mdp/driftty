name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: bun install --cwd gateway --frozen-lockfile
      - run: npm run test:all
      - run: npm run build
      - run: test "$(find dist -maxdepth 1 -name '*.html' | wc -l)" -eq 1
      - name: Validate Compose examples
        env:
          CLOUDFLARE_TUNNEL_TOKEN: validation
          DRIFTTY_PASSWORD: validation
        run: |
          docker compose config --quiet
          docker compose -f examples/cloudflare-ssh/compose.yaml config --quiet
          docker compose -f examples/docker-development/compose.yaml config --quiet
      - name: Build images
        run: |
          docker build --target generic -t driftty:test .
          docker build --target demo -t driftty-demo:test .
          docker build --target gateway -t driftty-gateway:test .
      - name: Test local tmux gateway
        env:
          DRIFTTY_GATEWAY_IMAGE: driftty-gateway:test
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          scripts/local-tmux-gateway.integration.test.sh
      - name: Smoke test arbitrary command
        run: |
          id=$(docker run -d -p 17681:7681 driftty:test sh)
          trap 'docker rm -f "$id"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:17681/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:17681/ | grep -q 'terminal-container'
      - name: Smoke test coding CLI demo
        run: |
          id=$(docker run -d -p 17117:7117 driftty-demo:test)
          trap 'docker rm -f "$id"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:17117/ >/dev/null && break
            sleep 1
          done
          node --input-type=module <<'NODE'
          const token = await fetch('http://127.0.0.1:17117/token')
            .then((response) => response.json());
          await new Promise((resolve, reject) => {
            const socket = new WebSocket('ws://127.0.0.1:17117/ws', ['tty']);
            socket.addEventListener('open', () => {
              socket.send(new TextEncoder().encode(JSON.stringify({
                AuthToken: token.token,
                columns: 80,
                rows: 24,
              })));
              setTimeout(() => socket.close(), 1000);
            });
            socket.addEventListener('close', resolve);
            socket.addEventListener('error', reject);
          });
          NODE
          docker exec "$id" sh -lc '
            test "$(id -u)" = 1000
            tmux has-session -t driftty-demo
            test "$(opencode --version)" = "$OPENCODE_VERSION"
            test "$(cline --version)" = "$CLINE_VERSION"
            test "$(tmux list-windows -t driftty-demo -F "#{window_name}" | sort | tr "\\n" " ")" = "Cline OpenCode Readme "
            test -s /workspace/README.md
          '
      - name: Verify all images contain the same mobile client
        run: |
          generic_client=$(docker run --rm --entrypoint sha256sum driftty:test /usr/share/ttyd/index.html | cut -d' ' -f1)
          demo_client=$(docker run --rm --entrypoint sha256sum driftty-demo:test /usr/share/ttyd/index.html | cut -d' ' -f1)
          gateway_client=$(docker run --rm --entrypoint sha256sum driftty-gateway:test /usr/share/ttyd/index.html | cut -d' ' -f1)
          test -n "$generic_client"
          test "$generic_client" = "$demo_client"
          test "$generic_client" = "$gateway_client"
      - name: Validate generated Caddy configuration
        run: |
          bun -e "import {caddyConfig} from './gateway/src/caddy.ts'; await Bun.write('/tmp/Caddyfile', caddyConfig([{slug:'baz',ttydPort:7800}], []));"
          docker run --rm -v /tmp/Caddyfile:/tmp/Caddyfile:ro --entrypoint caddy driftty-gateway:test validate --config /tmp/Caddyfile --adapter caddyfile

  publish-edge:
    if: github.event_name == 'push'
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: edge
    secrets: inherit
