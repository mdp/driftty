name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: bun install --cwd gateway --frozen-lockfile
      - run: npm run test:all
      - run: npm run build
      - run: test "$(find dist -maxdepth 1 -name '*.html' | wc -l)" -eq 1
      - name: Validate Compose examples
        env:
          CLOUDFLARE_TUNNEL_TOKEN: validation
          DRIFTTY_PASSWORD: validation
        run: |
          docker compose config --quiet
          docker compose -f examples/cloudflare-ssh/compose.yaml config --quiet
          docker compose -f examples/docker-development/compose.yaml config --quiet
      - name: Build images
        run: |
          docker build --target generic -t driftty:test .
          docker build --target demo -t driftty-demo:test .
          docker build --target gateway -t driftty-gateway:test .
      - name: Test local tmux gateway
        env:
          DRIFTTY_GATEWAY_IMAGE: driftty-gateway:test
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          scripts/local-tmux-gateway.integration.test.sh
      - name: Smoke test arbitrary command
        run: |
          id=$(docker run -d -p 17681:7681 driftty:test sh)
          trap 'docker rm -f "$id"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:17681/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:17681/ | grep -q 'terminal-container'
      - name: Smoke test coding CLI demo
        run: |
          id=$(docker run -d -p 17117:7117 \
            -e DRIFTTY_DEMO_PASSWORD=smoke-secret \
            driftty-demo:test)
          trap 'docker rm -f "$id"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS -u driftty:smoke-secret http://127.0.0.1:17117/ >/dev/null && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:17117/)" = 401
          node --input-type=module <<'NODE'
          import {createConnection} from 'node:net';
          import {randomBytes} from 'node:crypto';
          const host = '127.0.0.1';
          const port = 17117;
          const auth = 'Basic ' + Buffer.from('driftty:smoke-secret').toString('base64');
          const {token} = await fetch(`http://${host}:${port}/token`, {
            headers: {authorization: auth},
          }).then((response) => response.json());
          const key = randomBytes(16).toString('base64');
          const socket = createConnection({host, port});
          const result = await new Promise((resolve, reject) => {
            const timer = setTimeout(
              () => reject(new Error('websocket smoke test timed out')),
              10000,
            );
            let buffer = Buffer.alloc(0);
            let opened = false;
            socket.on('connect', () => {
              socket.write(
                `GET /ws HTTP/1.1\r\n` +
                `Host: ${host}:${port}\r\n` +
                `Upgrade: websocket\r\n` +
                `Connection: Upgrade\r\n` +
                `Sec-WebSocket-Key: ${key}\r\n` +
                `Sec-WebSocket-Version: 13\r\n` +
                `Sec-WebSocket-Protocol: tty\r\n` +
                `Authorization: ${auth}\r\n\r\n`,
              );
            });
            socket.on('data', (chunk) => {
              buffer = Buffer.concat([buffer, chunk]);
              if (!opened && buffer.includes('\r\n\r\n')) {
                const end = buffer.indexOf('\r\n\r\n');
                const status = buffer.slice(0, end).toString().split('\r\n')[0];
                if (!status.includes('101')) {
                  reject(new Error(`websocket handshake failed: ${status}`));
                  return;
                }
                buffer = buffer.slice(end + 4);
                opened = true;
                const payload = Buffer.from(JSON.stringify({
                  AuthToken: token,
                  columns: 80,
                  rows: 24,
                }), 'utf8');
                socket.write(maskedFrame(payload));
              } else if (opened) {
                clearTimeout(timer);
                resolve('attached to terminal');
                socket.destroy();
              }
            });
            socket.on('error', reject);
          });
          console.log(result);

          function maskedFrame(payload) {
            const mask = randomBytes(4);
            const body = Buffer.from(payload);
            for (let i = 0; i < body.length; i++) body[i] ^= mask[i % 4];
            let header;
            if (body.length < 126) {
              header = Buffer.from([0x82, 0x80 | body.length]);
            } else {
              header = Buffer.alloc(4);
              header[0] = 0x82;
              header[1] = 0x80 | 126;
              header.writeUInt16BE(body.length, 2);
            }
            return Buffer.concat([header, mask, body]);
          }
          NODE
          docker exec "$id" sh -lc '
            test "$(id -u)" = 1000
            tmux has-session -t driftty-demo
            test "$(opencode --version)" = "$OPENCODE_VERSION"
            test "$(cline --version)" = "$CLINE_VERSION"
            test "$(tmux list-windows -t driftty-demo -F "#{window_name}" | sort | tr "\\n" " ")" = "Cline OpenCode Readme "
            test -s /workspace/README.md
          '
      - name: Verify all images contain the same mobile client
        run: |
          generic_client=$(docker run --rm --entrypoint sha256sum driftty:test /usr/share/ttyd/index.html | cut -d' ' -f1)
          demo_client=$(docker run --rm --entrypoint sha256sum driftty-demo:test /usr/share/ttyd/index.html | cut -d' ' -f1)
          gateway_client=$(docker run --rm --entrypoint sha256sum driftty-gateway:test /usr/share/ttyd/index.html | cut -d' ' -f1)
          test -n "$generic_client"
          test "$generic_client" = "$demo_client"
          test "$generic_client" = "$gateway_client"
      - name: Validate generated Caddy configuration
        run: |
          bun -e "import {caddyConfig} from './gateway/src/caddy.ts'; await Bun.write('/tmp/Caddyfile', caddyConfig([{slug:'baz',ttydPort:7800}], []));"
          docker run --rm -v /tmp/Caddyfile:/tmp/Caddyfile:ro --entrypoint caddy driftty-gateway:test validate --config /tmp/Caddyfile --adapter caddyfile

  publish-edge:
    if: github.event_name == 'push'
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: edge
    secrets: inherit
