name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/package-release.ts "${GITHUB_REF_NAME}"
      - run: cp "release/ttyd-mobile-${GITHUB_REF_NAME#v}.tar.gz" release/ttyd-mobile-compose.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/ttyd-mobile-compose.tar.gz

  latest:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Add SemVer and latest tags
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          for image in ttyd-mobile ttyd-mobile-gateway; do
            docker buildx imagetools create \
              -t "ghcr.io/mdp/$image:$version" \
              -t "ghcr.io/mdp/$image:latest" \
              "ghcr.io/mdp/$image:$VERSION"
          done
