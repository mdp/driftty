name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  native:
    uses: ./.github/workflows/native.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: [publish, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/package-release.ts "${GITHUB_REF_NAME}"
      - run: cp "release/driftty-${GITHUB_REF_NAME#v}.tar.gz" release/driftty-compose.tar.gz
      - uses: actions/download-artifact@v4
        with:
          pattern: native-terminal-*
          path: release
          merge-multiple: true
      - name: Assemble release checksums and installer
        run: |
          cp install.sh release/install.sh
          cd release
          sha256sum driftty-compose.tar.gz driftty-terminal-linux-*.tar.gz install.sh > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/driftty-compose.tar.gz
            release/driftty-terminal-linux-*.tar.gz
            release/SHA256SUMS
            release/install.sh

  latest:
    needs: [publish, release]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Add SemVer and latest tags
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          for image in driftty driftty-demo driftty-gateway; do
            docker buildx imagetools create \
              -t "ghcr.io/mdp/$image:$version" \
              -t "ghcr.io/mdp/$image:latest" \
              "ghcr.io/mdp/$image:$VERSION"
          done
